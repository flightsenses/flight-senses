<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Qatar Airways - Flight Senses</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #061a33;
            color: white;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: #08264a;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            color: #9fc9ff;
            font-size: 18px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .info {
            background: #0b2d52;
            padding: 25px;
            border-radius: 15px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #31577d;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 20px;
            background: #0077ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>Qatar Airways</h1>
    <p>Going Places Together ✈️🇶🇦</p>
</header>

<div class="container">

    <div class="info">

        <div class="info-row">
            <strong>Founded</strong>
            <span>1993</span>
        </div>

        <div class="info-row">
            <strong>Headquarters</strong>
            <span>Doha, Qatar</span>
        </div>

        <div class="info-row">
            <strong>Airline Code</strong>
            <span>QR</span>
        </div>

        <div class="info-row">
            <strong>Hub</strong>
            <span>Hamad International Airport</span>
        </div>

        <div class="info-row">
            <strong>Alliance</strong>
            <span>oneworld</span>
        </div>

        <div class="info-row">
            <strong>Fleet</strong>
            <span>Airbus & Boeing aircraft</span>
        </div>

        <div class="info-row">
            <strong>Network</strong>
            <span>Global</span>
        </div>

    </div>

    <a href="airlines.html" class="back">
        ← Back to Airlines
    </a>

</div>

</body>
</html>
