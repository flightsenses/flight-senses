<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Boeing 747 | Flight Senses</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #07111f;
            color: white;
        }

        header {
            background: #0b1d33;
            padding: 25px;
            text-align: center;
            border-bottom: 2px solid #1e90ff;
        }

        header h1 {
            margin: 0;
            font-size: 38px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
        }

        .title {
            text-align: center;
        }

        .title h2 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .title p {
            color: #9ecbff;
            font-size: 18px;
        }

        .info {
            background: #0d2036;
            border: 1px solid #1c4d78;
            border-radius: 15px;
            padding: 30px;
            margin-top: 40px;
        }

        .info h3 {
            color: #4da6ff;
            font-size: 26px;
        }

        .specs {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }

        .spec {
            background: #071827;
            padding: 20px;
            border-radius: 10px;
        }

        .spec strong {
            color: #4da6ff;
        }

        .back {
            display: block;
            width: fit-content;
            margin: 40px auto;
            padding: 12px 25px;
            background: #1e90ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>✈️ Flight Senses</h1>
</header>

<div class="container">

    <div class="title">
        <h2>Boeing 747</h2>
        <p>The legendary Queen of the Skies 👑</p>
    </div>

    <div class="info">

        <h3>Aircraft Specifications</h3>

        <div class="specs">

            <div class="spec">
                <strong>Manufacturer</strong>
                <p>Boeing</p>
            </div>

            <div class="spec">
                <strong>First Flight</strong>
                <p>1969</p>
            </div>

            <div class="spec">
                <strong>Length</strong>
                <p>76.25 m</p>
            </div>

            <div class="spec">
                <strong>Wingspan</strong>

            </div>

            </div>

            </div>

            <div class="spec">
                <strong>Typical Cruise Speed</strong>
                <p>≈ Mach 0.85</p>
            </div>

            <div class="spec">
                <strong>Type</strong>
                <p>Wide-body jet airliner</p>
            </div>

        </div>

    </div>

</div>

</html>
