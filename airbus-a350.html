<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Airbus A350 - Flight Senses</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #061a33;
            color: white;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: #08264a;
        }

        header h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        header p {
            color: #9fc9ff;
            font-size: 18px;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }

        .specs {
            background: #0b2d52;
            padding: 25px;
            border-radius: 15px;
        }

        .spec {
            display: flex;
            justify-content: space-between;
            padding: 14px 0;
            border-bottom: 1px solid #31577d;
        }

        .spec:last-child {
            border-bottom: none;
        }

        .back {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 20px;
            background: #0077ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>

<body>

<header>
    <h1>Airbus A350</h1>
    <p>A new generation long-range wide-body aircraft ✈️</p>
</header>

<div class="container">

    <div class="specs">

        <div class="spec">
            <strong>Manufacturer</strong>
            <span>Airbus</span>
        </div>

        <div class="spec">
            <strong>First Flight</strong>
            <span>2013</span>
        </div>

        <div class="spec">
            <strong>Length</strong>
            <span>66.8 m (A350-900)</span>
        </div>

        <div class="spec">
            <strong>Wingspan</strong>
            <span>64.75 m</span>
        </div>

        <div class="spec">
            <strong>Range</strong>
            <span>≈ 15,750 km</span>
        </div>

        <div class="spec">
            <strong>Engines</strong>
            <span>2 × Rolls-Royce Trent XWB</span>
        </div>

        <div class="spec">
            <strong>Cruise Speed</strong>
            <span>Mach 0.85</span>
        </div>

        <div class="spec">
            <strong>Type</strong>
            <span>Wide-body twin-engine jet</span>
        </div>

    </div>

    <a href="aircraft.html" class="back">← Back to Aircraft</a>

</div>

</body>
</html>
